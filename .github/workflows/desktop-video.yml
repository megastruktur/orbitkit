name: Desktop Video

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  video-windows:
    name: video-windows
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure pnpm shell on Windows
        run: pnpm config set script-shell "C:\\Program Files\\Git\\bin\\bash.exe"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm -r build

      - name: Build starter desktop app
        run: pnpm --filter starter tauri build --debug --no-bundle

      - name: Record desktop flow
        shell: pwsh
        run: |
          scripts/ci/record-windows.ps1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-windows
          path: |
            video-windows.mp4
            01-main.png
            02-overlay.png
            03-menu-open.png
            04-notes-popup.png
            app.log
            app-err.log
            timeline.txt
          retention-days: 14

# r3 removed the video-macos job; okv_demo-and-video re-added it and ported
# record-macos.sh to the 0.2.0 starter (auto-show overlay, demoWindowFit
# geometry, toggle-closes, mascot-centre drag, converging pair retries).
# Runs 36733228980/36734942689/36737264388/36738526701: the port is correct
# (clicks 1..N deliver while the overlay keeps key status — Alert and Badge
# actions fired), but on the current macOS runner the SECOND popup
# interaction still dies: after the first Notes popup opens, overlay clicks
# stop being delivered (zero DOM events) and the popup ends up hidden behind
# the main window — a plugin/webview z-order & focus lifecycle issue in
# crates/tauri-plugin-orbitkit territory, outside the okv_demo-and-video
# scope allowlist. The SHOWCASE video is the WINDOWS worker recording
# (coordinator directive); the ported script + findings stay in
# scripts/ci/record-macos.sh and evidence/okv/demo-and-video/REPORT.md for
# whoever picks the product fix up. VITE_ORBITKIT_DEBUG=1 on the windows
# build bakes the runtime telemetry (MascotView boot line) into app.log.
