[package]
name = "starter"
version = "0.1.0"
description = "OrbitKit starter consumer app (Tauri v2)"
edition = "2021"

[lib]
name = "orbitkit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
mic-recorder = []
wry = ["tauri/wry"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = [] }
tauri-plugin-orbitkit = { path = "../../../crates/tauri-plugin-orbitkit" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
jni = { version = "0.21", default-features = false }
